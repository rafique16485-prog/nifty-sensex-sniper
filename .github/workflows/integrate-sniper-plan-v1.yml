name: Integrate Sniper Plan V1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add retest-gated trading plan panel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="sniperPlanV1Panel"' not in s:
              panel='''<section class="section" id="sniperPlanV1Panel"><h2>🎯 Sniper Trade Plan V1</h2><div class="verdict"><div class="label">RETEST-GATED PLAN</div><div class="big yellow" id="planDecision">NO TRADE</div><div class="rows"><div class="row"><span class="label">Entry</span><b id="planEntry">—</b></div><div class="row"><span class="label">Stop Loss</span><b id="planSL">—</b></div><div class="row"><span class="label">Target 1</span><b id="planT1">—</b></div><div class="row"><span class="label">Target 2</span><b id="planT2">—</b></div></div><div class="mini"><span>Retest Gate</span><b id="planRetest">WAIT</b></div><div class="mini"><span>Risk Points</span><b id="planRisk">—</b></div><div class="status" id="planGate">Waiting for confirmation…</div><div class="tip">ELI5: direction alone is not enough. The plan needs fresh data, market-open status and an SMC retest before showing entry/SL/targets.</div><div class="label" id="planUpdated">Sniper Plan V1: waiting</div></div></section>'''
              anchor='</main>'
              s=s.replace(anchor,panel+anchor,1)
          if 'loadSniperPlanV1' not in s:
              script='''<script>(async function loadSniperPlanV1(){const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};const side=v=>{v=String(v||'').toUpperCase();return v==='CALL'||v.includes('BULL')?'CALL':v==='PUT'||v.includes('BEAR')?'PUT':'NO TRADE'};const color=(id,v)=>{const e=document.getElementById(id);if(!e)return;e.className=e.className.replace(/\\b(green|red|yellow)\\b/g,'').trim()+' '+(v==='CALL'?'green':v==='PUT'?'red':'yellow')};try{const r=await fetch('/api/plan?ts='+Date.now(),{cache:'no-store'}),d=await r.json();const dec=side(d.decision);set('planDecision',dec);set('planEntry',d.plan?.entry??'—');set('planSL',d.plan?.stoploss??'—');set('planT1',d.plan?.target1??'—');set('planT2',d.plan?.target2??'—');set('planRisk',d.plan?.risk_points??'—');set('planRetest',d.gates?.retest?'CONFIRMED':'WAIT');set('planGate',d.gate||'Plan waiting');set('planUpdated','Updated '+new Date().toLocaleTimeString()+' • Sniper Plan V1');color('planDecision',dec);color('planRetest',d.gates?.retest?'CALL':'NO TRADE')}catch(e){set('planDecision','NO TRADE');set('planGate','Plan engine unavailable — conservative fallback.');set('planUpdated','Sniper Plan V1 unavailable');}})();</script>'''
              s=s.replace('</body>',script+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit dashboard integration
        run: |
          if git diff --quiet; then echo "Sniper Plan V1 already integrated"; else git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"; git add index.html; git commit -m "Integrate Sniper Trade Plan V1"; git push; fi
