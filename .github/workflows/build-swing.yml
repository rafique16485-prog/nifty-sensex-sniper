name: Build Swing Scanner
on:
  push:
    paths:
      - 'api/swing.js'
      - 'scripts/swing_ui.py'
      - 'index.html'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/swing_ui.py
      - run: node --check api/swing.js
      - run: python -m py_compile scripts/swing_ui.py
      - run: git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Build Swing Scanner V1 UI'
          git push
