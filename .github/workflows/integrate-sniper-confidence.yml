name: Integrate Sniper Confidence Engine

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Sniper Confidence panel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="sniperConfidencePanel"' not in s:
              panel='''<section class="section" id="sniperConfidencePanel"><h2>🎯 Sniper Confidence Engine</h2><div class="verdict"><div class="label">CROSS-MARKET DECISION</div><div class="big yellow" id="scVerdict">NO TRADE</div><div class="rows"><div class="row"><span class="label">Confidence</span><b id="scConfidence">— / 10</b></div><div class="row"><span class="label">Agreement</span><b id="scAgreement">—%</b></div></div><div class="why-grid" id="scSources"><div class="why-item"><span class="label">Live Engine</span><b>WAIT</b></div><div class="why-item"><span class="label">Forecast</span><b>WAIT</b></div><div class="why-item"><span class="label">News</span><b>WAIT</b></div><div class="why-item"><span class="label">Risk</span><b>WAIT</b></div></div><div class="tip waitbox" id="scWait"><b>WAIT:</b> Loading cross-factor confirmation…</div><div class="label" id="scUpdated">Confidence: waiting</div><div class="tip">🛡️ V1 combines the existing technical engine, 5m forecast and filtered news context. Conflicting signals or high news risk force NO TRADE.</div></div></section>'''
              marker='</main>'
              s=s.replace(marker,panel+marker,1)
              script='''<script>(async function loadSniperConfidence(){try{const r=await fetch('/api/sniper-confidence?ts='+Date.now(),{cache:'no-store'});const d=await r.json();if(!d.ok)throw Error(d.error||'Unavailable');const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};set('scVerdict',d.verdict||'NO TRADE');set('scConfidence',`${d.confidence??'—'} / 10`);set('scAgreement',`${d.agreement??'—'}%`);const s=d.sources||{};set('scSources',`Live Engine: ${s.live||'WAIT'} • Forecast: ${s.forecast||'WAIT'} • News: ${s.news||'WAIT'} • Risk: ${d.risk||'WAIT'}`);set('scWait',d.wait||'Waiting for confirmation');set('scUpdated',d.generated_at?`Updated ${new Date(d.generated_at).toLocaleTimeString()} • Sniper Confidence V1`:'Confidence ready');const v=document.getElementById('scVerdict');if(v)v.className='big '+(d.verdict==='CALL'?'green':d.verdict==='PUT'?'red':'yellow');}catch(e){const v=document.getElementById('scVerdict');if(v)v.textContent='NO TRADE';setTimeout(()=>{},0);}})();</script>'''
              s=s.replace('</body>',script+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit dashboard integration
        run: |
          if git diff --quiet; then echo "Sniper Confidence UI already integrated"; else git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"; git add index.html; git commit -m "Integrate Sniper Confidence Engine V1"; git push; fi
