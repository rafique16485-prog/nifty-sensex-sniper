name: Fix Mobile Readability and Stock Search
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate stock analysis API and UI script
        run: |
          node --check api/stock-analysis.js
          python -m py_compile scripts/mobile_readability_accessibility.py
          git diff --check
