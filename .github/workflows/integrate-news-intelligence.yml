name: Integrate News Intelligence

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add News Intelligence panel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="newsIntelPanel"' not in s:
              panel='''<section class="section" id="newsIntelPanel"><h2>🧠 News Intelligence</h2><div class="card"><div class="mini"><span>News Bias</span><b id="newsIntelBias" class="yellow">MIXED</b></div><div class="mini"><span>Risk Level</span><b id="newsIntelRisk" class="yellow">UNKNOWN</b></div><div class="mini"><span>Headline Score</span><b id="newsIntelScore">0</b></div><div class="tip" id="newsIntelGate">News is context only. High-risk news opposing a technical CALL/PUT blocks the trade.</div><div class="label" id="newsIntelUpdated">News Intelligence: waiting</div></div></section>'''
              marker='<section class="section" id="newsRadar">'
              s=s.replace(marker,panel+marker,1) if marker in s else s.replace('</main>',panel+'</main>',1)
              script='''<script>(async function loadNewsIntel(){try{const r=await fetch('/api/live?action=engine&ts='+Date.now(),{cache:'no-store'});const d=await r.json();const n=d.news_intelligence||{};const b=document.getElementById('newsIntelBias'),risk=document.getElementById('newsIntelRisk'),score=document.getElementById('newsIntelScore'),gate=document.getElementById('newsIntelGate'),u=document.getElementById('newsIntelUpdated');if(b)b.textContent=n.side||'MIXED';if(risk)risk.textContent=n.risk||'UNKNOWN';if(score)score.textContent=String(n.score??0);if(gate)gate.textContent=d.news_gate?.veto?'⚠️ High-risk news conflicts with the technical setup — NO TRADE gate active.':`News context: ${n.side||'MIXED'} • Risk ${n.risk||'UNKNOWN'} • ${n.headline_count||0} headlines`;if(u)u.textContent=n.updated_at?`Updated ${new Date(n.updated_at).toLocaleTimeString()}`:'News Intelligence ready';}catch(e){const g=document.getElementById('newsIntelGate');if(g)g.textContent='News Intelligence temporarily unavailable — technical engine remains conservative.';}})();</script>'''
              s=s.replace('</body>',script+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit dashboard integration
        run: |
          if git diff --quiet; then echo "News Intelligence UI already integrated"; else git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"; git add index.html; git commit -m "Integrate News Intelligence panel"; git push; fi
