name: Fix Sniper V2 Agreement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix agreement semantics and remove duplicate V1 panel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="let agreement=directional===0?0:Math.round(Math.max(bull,bear)/directional*100);"
          new="let agreement=directional<2?'INSUFFICIENT':Math.round(Math.max(bull,bear)/directional*100);"
          if old in s:
              s=s.replace(old,new,1)
          s=s.replace('<span class=\"label\">Agreement</span><b id=\"sv2Agreement\">—%</b>','<span class=\"label\">Directional Agreement</span><b id=\"sv2Agreement\">—</b>',1)
          s=s.replace('Neutral signals are excluded from agreement.','Neutral signals are excluded from agreement. One directional signal is not enough to claim agreement.',1)
          marker='<section class="section"><h2>🎯 Sniper Confidence Engine V1</h2>'
          start=s.find(marker)
          if start>=0:
              end=s.find('</section>', start)
              if end>=0:
                  s=s[:start]+s[end+10:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then echo "Sniper V2 already fixed"; else git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"; git add index.html; git commit -m "Fix Sniper V2 agreement semantics"; git push; fi
