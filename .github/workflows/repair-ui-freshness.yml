name: Repair UI and Freshness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate APIs and scripts
        run: |
          node --check api/live.js
          node --check api/plan.js
          node --check api/swing.js
          node --check api/events.js
          node --check api/smart-money.js
          node --check api/stock-analysis.js
          python -m py_compile scripts/*.py
          git diff --check
