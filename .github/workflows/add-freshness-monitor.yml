name: Add Freshness Monitor V2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add freshness monitor to dashboard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="freshnessV2Panel"' not in s:
              panel='''<section class="section" id="freshnessV2Panel"><h2>🛰️ Data Freshness Monitor V2</h2><div class="verdict"><div class="rows"><div class="row"><span class="label">Overall Data</span><b id="fmOverall">WAIT</b></div><div class="row"><span class="label">Snapshot Age</span><b id="fmAge">—</b></div><div class="row"><span class="label">NIFTY</span><b id="fmNifty">—</b></div><div class="row"><span class="label">SENSEX</span><b id="fmSensex">—</b></div><div class="row"><span class="label">Options</span><b id="fmOptions">—</b></div></div><div class="status" id="fmGate">Checking live data…</div><div class="tip">Fresh data is required before any Entry / SL / Target is displayed.</div><div class="label" id="fmUpdated">Freshness V2: waiting</div></div></section>'''
              s=s.replace('</main>',panel+'</main>',1)
          if 'loadFreshnessMonitorV2' not in s:
              script='''<script>(async function loadFreshnessMonitorV2(){const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};const ageOf=v=>{if(!v)return null;const t=Date.parse(v);return Number.isFinite(t)?Math.max(0,(Date.now()-t)/1000):null};const label=a=>a==null?'UNKNOWN':a<=30?'FRESH':a<=120?'AGING':'STALE';try{const ts=Date.now();const r=await fetch('/api/live?action=market&ts='+ts,{cache:'no-store'}),d=await r.json();if(!d||d.ok===false)throw Error('market unavailable');const age=ageOf(d.data_timestamp||d.fetched_at);const n=label(age),s=label(age);set('fmAge',age==null?'—':Math.round(age)+'s');set('fmNifty',n);set('fmSensex',s);set('fmOptions','CHECK WITH TRADE PLAN');const overall=label(age);set('fmOverall',overall);set('fmGate',overall==='FRESH'?'Fresh exchange snapshot available.':'Fresh exchange snapshot required before trade plan.');set('fmUpdated','Updated '+new Date().toLocaleTimeString()+' • Freshness Monitor V2');}catch(e){set('fmOverall','STALE');set('fmAge','—');set('fmNifty','UNKNOWN');set('fmSensex','UNKNOWN');set('fmOptions','UNKNOWN');set('fmGate','Live data unavailable — conservative NO TRADE.');set('fmUpdated','Freshness Monitor V2 fallback');}})();</script>'''
              s=s.replace('</body>',script+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit dashboard integration
        run: |
          if git diff --quiet; then echo "Freshness Monitor already integrated"; else git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"; git add index.html; git commit -m "Integrate Data Freshness Monitor V2"; git push; fi
